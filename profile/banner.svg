<title id="t">Flow Lab BR</title><desc id="d">Quatro blocos dourados ligados por linhas, como um fluxo de automação, ao lado do nome Flow Lab BR e da frase documentação do n8n em português.</desc><style>
.ln{stroke-dasharray:6 10;animation:flow 1.6s linear infinite}
